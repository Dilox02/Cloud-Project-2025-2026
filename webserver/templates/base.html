{% load static %}
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Cloud Project{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <header>
    <div class="header-top">
      <div>
        <h1>{% block heading %}Cloud Project{% endblock %}</h1>
        <div class="sub">{% block subheading %}{% endblock %}</div>
      </div>
      <nav class="main-nav">
        <a href="/" class="nav-link {% block nav_home %}{% endblock %}">Dashboard</a>
        <a href="/compare/" class="nav-link {% block nav_compare %}{% endblock %}">Compare</a>
      </nav>
    </div>
  </header>

  {% block content %}{% endblock %}

  {% block extra_js %}{% endblock %}
</body>
</html>
